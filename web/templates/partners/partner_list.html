{% extends 'layout.html' %}

{% block title %}Partners | DAISY{% endblock %}

{% block content %}
    <div class="mt-4 mb-8 flex flex-wrap items-center justify-between gap-4">
        <h1 class="font-display text-3xl font-medium tracking-tight text-primary-900 lg:text-5xl">Partners</h1>
        <a class="cursor-pointer inline-flex h-10 shrink-0 items-center justify-center gap-2 rounded-lg bg-primary-900 px-4 text-sm font-medium text-on-primary transition-[scale,background-color] duration-150 ease-out hover:bg-primary-800 active:scale-[0.96] focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary-900 motion-reduce:transition-none" href="{% url 'partners_add' %}"><i data-lucide="plus" class="h-4 w-4" aria-hidden="true"></i><span>Add partner</span></a>
    </div>
    <div class="gap-4 columns-1 md:columns-2 lg:columns-3">
        {% for partner in partner_list %}
            <div class="mb-4 break-inside-avoid rounded-sm bg-white shadow-sm">
                <div class="p-4">
                    <h2 class="mb-2 text-xl font-semibold">{{ partner.acronym }}</h2>
                    <ul class="flex flex-col gap-1">
                        <li>
                            <strong>Name: </strong>
                            {{  partner.name }}
                        </li>
                        <li>
                            <strong>Address: </strong>
                            {{  partner.address }}
                        </li>
                    </ul>
                </div>
            </div>
        {% empty %}
            <p>No partners yet</p>
        {% endfor %}
    </div>
{% endblock %}
