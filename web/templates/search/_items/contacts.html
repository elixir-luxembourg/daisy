{% for contact in data.contacts %}
    <div class="mb-4">
        <div class="rounded-sm bg-white shadow-sm">
            <div class="p-4">
                <h2 class="font-display text-2xl font-medium tracking-tight text-primary-900">
                    <a href="{% url 'contact' pk=contact.pk %}" class="text-primary-700 hover:underline">{{ contact.first_name }} {{ contact.last_name }}</a>
                </h2>
                <ul class="py-1 text-left">
                    <li class="flex items-center">
                      <strong>Role:</strong> <span class="inline-flex items-center ml-1 px-2.5 py-0.5 text-xs font-medium text-gray-800 bg-gray-200 rounded-full">{{ contact.type }}</span>
                    </li>
                    <li class="flex flex-wrap items-center"><strong>Affiliation(s):</strong>
                        {% for partner in contact.partners %}
                            <span class="inline-flex items-center ml-1 mb-1 px-2.5 py-0.5 text-xs font-medium text-white bg-primary-900 rounded-full">{{ partner }}</span>

                        {% empty %}
                            -
                        {% endfor %}
                    </li>
                </ul>
                <a href="{% url 'contact' pk=contact.pk %}" class="mt-2 cursor-pointer inline-flex h-10 items-center justify-center gap-2 rounded-lg border border-gray-200 bg-white px-4 text-sm font-medium text-primary-900 shadow-xs transition-[scale,box-shadow,background-color] duration-150 ease-out hover:bg-gray-50 hover:shadow-sm active:scale-[0.96] motion-reduce:transition-none">Details &raquo;</a>
            </div>
        </div>
    </div>
{% empty %}
    {% include "search/_items/no_results.html" %}
{% endfor %}
