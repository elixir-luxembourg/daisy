{% if items %}
<details class="rounded-sm bg-white shadow-sm">
    <summary class="flex cursor-pointer list-none items-center justify-between gap-2 p-4 text-sm font-semibold text-primary-950 [&::-webkit-details-marker]:hidden">
        <span>{{ label }}</span>
        <span class="inline-flex shrink-0 items-center rounded-xs border border-gray-200 bg-white px-2 py-0.5 text-xs text-gray-700">{{ items.count }}</span>
    </summary>
    <div class="border-t border-gray-100 px-4 pb-4">
        <ul class="divide-y divide-gray-100">
            {% for item in items|slice:":5" %}
            <li class="py-2">
                <a href="{% if kind == 'dataset' %}{% url 'dataset' pk=item.pk %}{% elif kind == 'contract' %}{% url 'contract' pk=item.pk %}{% elif kind == 'data_declaration' %}{% url 'data_declaration' pk=item.pk %}{% elif kind == 'project' %}{% url 'project' pk=item.pk %}{% elif kind == 'dac' %}{% url 'dac' pk=item.pk %}{% elif kind == 'partner' %}{% url 'partner' pk=item.pk %}{% elif kind == 'cohort' %}{% url 'cohort' pk=item.pk %}{% endif %}" class="block truncate text-sm font-medium text-primary-950 hover:underline">{{ item }}</a>
            </li>
            {% endfor %}
        </ul>
        {% if items.count > 5 and list_url %}
        <p class="mt-1 text-xs"><a href="{% url list_url %}" class="font-medium text-primary-950 hover:underline">View all &rarr;</a></p>
        {% endif %}
    </div>
</details>
{% endif %}
