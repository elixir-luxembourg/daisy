<div data-paginate-controls="{{ key }}" class="flex items-center justify-between gap-3 py-3">
    <button type="button" data-paginate-prev class="inline-flex items-center gap-1 rounded-lg border border-gray-300 bg-white px-3 py-1.5 font-display text-xs font-semibold uppercase tracking-[0.15em] transition-colors text-primary-900 hover:border-primary-900 hover:bg-primary-900 hover:text-on-primary focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary-900 disabled:cursor-not-allowed disabled:border-gray-200 disabled:text-gray-400 disabled:hover:border-gray-200 disabled:hover:bg-white disabled:hover:text-gray-400">← prev</button>
    <button type="button" data-paginate-next class="inline-flex items-center gap-1 rounded-lg border border-gray-300 bg-white px-3 py-1.5 font-display text-xs font-semibold uppercase tracking-[0.15em] transition-colors text-primary-900 hover:border-primary-900 hover:bg-primary-900 hover:text-on-primary focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary-900 disabled:cursor-not-allowed disabled:border-gray-200 disabled:text-gray-400 disabled:hover:border-gray-200 disabled:hover:bg-white disabled:hover:text-gray-400">next →</button>
</div>
