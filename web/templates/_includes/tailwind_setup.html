{% load static %}

<link rel="preload" href="{% static 'fonts/barlow-400.woff2' %}" as="font" type="font/woff2" crossorigin />
<link rel="preload" href="{% static 'fonts/barlow-500.woff2' %}" as="font" type="font/woff2" crossorigin />
<link rel="preload" href="{% static 'fonts/barlow-600.woff2' %}" as="font" type="font/woff2" crossorigin />
<link rel="preload" href="{% static 'fonts/barlow-condensed-600.woff2' %}" as="font" type="font/woff2" crossorigin />

<link href="{% static 'vendor/datatables/css/dataTables.tailwindcss.min.css' %}" rel="stylesheet"/>

<script src="{% static 'vendor/tailwindcss/browser.js' %}"></script>
<script defer src="{% static 'vendor/datatables/js/dataTables.min.js' %}"></script>
<script defer src="{% static 'vendor/datatables/js/dataTables.tailwindcss.min.js' %}"></script>
<script defer src="{% static 'vendor/lucide/lucide.min.js' %}"></script>
<script>
    document.addEventListener("DOMContentLoaded", function () {
        if (window.lucide) {
            window.lucide.createIcons();
        }
    });
</script>
<style type="text/tailwindcss">
      /* Tailwind framework first (explicit, not auto-injected — see note below). */
      @import "tailwindcss";

      /* Shared LCSB/UNI design system — vendored from elixir-lu/ui and inlined
         here (the browser build can't pull in external CSS files). tokens.css
         defines the semantic tier (primary/danger/info/accent/on-primary) +
         fonts. primary stays UNI Blue — no DAISY override needed.
         DAISY consumes the design system as PURE UTILITIES (see the reference
         styleguide-utilities.html in elixir-lu-ui): components.css is NOT
         loaded — templates carry the expanded utility strings directly.
         See web/templates/elixir-lu-ui/SOURCE.md.
         NOTE: keep the framework import above explicit and avoid writing the
         at-import token anywhere else in this block — the browser build treats a
         stray occurrence (even in a comment) as a signal to skip auto-injection. */
      {% include 'elixir-lu-ui/tokens.css' %}

      @layer base {
        button:not(:disabled),
        [type="button"]:not(:disabled),
        [type="submit"]:not(:disabled),
        [type="reset"]:not(:disabled),
        [role="button"]:not(:disabled),
        summary {
          cursor: pointer;
        }
        button:disabled,
        [type="button"]:disabled,
        [type="submit"]:disabled,
        [type="reset"]:disabled {
          cursor: not-allowed;
        }
      }

      @font-face {
        font-family: "Barlow";
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url("{% static 'fonts/barlow-400.woff2' %}") format("woff2");
      }

      @font-face {
        font-family: "Barlow";
        font-style: normal;
        font-weight: 500;
        font-display: swap;
        src: url("{% static 'fonts/barlow-500.woff2' %}") format("woff2");
      }

      @font-face {
        font-family: "Barlow";
        font-style: normal;
        font-weight: 600;
        font-display: swap;
        src: url("{% static 'fonts/barlow-600.woff2' %}") format("woff2");
      }

      @font-face {
        font-family: "Barlow";
        font-style: normal;
        font-weight: 700;
        font-display: swap;
        src: url("{% static 'fonts/barlow-700.woff2' %}") format("woff2");
      }

      @font-face {
        font-family: "Barlow Condensed";
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url("{% static 'fonts/barlow-condensed-400.woff2' %}") format("woff2");
      }

      @font-face {
        font-family: "Barlow Condensed";
        font-style: normal;
        font-weight: 500;
        font-display: swap;
        src: url("{% static 'fonts/barlow-condensed-500.woff2' %}") format("woff2");
      }

      @font-face {
        font-family: "Barlow Condensed";
        font-style: normal;
        font-weight: 600;
        font-display: swap;
        src: url("{% static 'fonts/barlow-condensed-600.woff2' %}") format("woff2");
      }
</style>
