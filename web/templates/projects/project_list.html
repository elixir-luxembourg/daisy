{% extends 'layout.html' %}

{% block title %}Projects | DAISY{% endblock %}

{% block content %}
    <div class="mt-4">
        <h1 class="font-display text-3xl font-medium tracking-tight text-primary-900 lg:text-5xl">Projects</h1>
    </div>
    <div class="flex flex-wrap w-full">
        {% for project in  project_list %}
            <div class="card-item rounded-sm bg-white shadow-sm m-2">
                <div class="p-4">
                    <h2 class="mb-2 text-xl font-semibold">{{ project }}</h2>
                    <a href="{% url 'project' pk=project.id %}" class="cursor-pointer inline-flex h-10 items-center justify-center gap-2 rounded-lg bg-primary-900 px-4 text-sm font-medium text-on-primary transition-[scale,background-color] duration-150 ease-out hover:bg-primary-800 active:scale-[0.96] focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary-900 motion-reduce:transition-none">Details</a>
                </div>
            </div>
        {% empty %}
            <p>No project yet</p>
        {% endfor %}
    </div>
{% endblock %}


{% block floating-buttons %}
    <a class="fixed bottom-6 right-6 z-40 inline-flex h-14 w-14 items-center justify-center text-white rounded-full bg-primary-900 shadow-lg hover:bg-primary-800" href="{% url 'project_add' %}" title="Add project" aria-label="Add project"><i data-lucide="plus" class="h-6 w-6"></i></a>
{% endblock %}
